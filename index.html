<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reta2</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 font-family:system-ui,-apple-system,sans-serif;
 color:white;
 background:linear-gradient(150deg,#101020,#271343);
}
.app{max-width:700px;margin:auto;padding:30px 20px 70px}
.logo{text-align:center;font-size:58px;font-weight:900;line-height:1}
.logo b{color:#ffd23f}
.slogan{text-align:center;color:#ccc;font-size:22px;margin:8px 0 30px}

.top{display:flex;justify-content:space-between;gap:12px;margin-bottom:30px}
.pill{
 background:#ffffff10;
 border:1px solid #ffffff20;
 border-radius:22px;
 padding:14px 18px;
 font-weight:800;
 font-size:18px
}

.card{
 background:#ffffff0c;
 border:1px solid #ffffff18;
 border-radius:32px;
 padding:28px;
 margin-bottom:25px;
 box-shadow:0 20px 50px #0002
}
h2{font-size:30px;margin:0 0 15px}
.sub{color:#c8c5d0;font-size:18px}

.mainbtn{
 width:100%;
 border:0;
 border-radius:25px;
 padding:22px 12px;
 background:#ffd23f;
 color:#171326;
 font-size:21px;
 font-weight:900;
 margin-top:15px
}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.cat,.answer{
 border:0;
 background:white;
 color:#171326;
 border-radius:25px;
 padding:25px 8px;
 font-size:19px;
 font-weight:850
}
.cat span{display:block;font-size:32px;margin-bottom:8px}

.hidden{display:none}

.gamehead{display:flex;justify-content:space-between;align-items:center}
.progress{
 height:10px;background:#ffffff12;border-radius:10px;
 margin:25px 0;overflow:hidden
}
.bar{height:100%;background:#ffd23f;width:20%;transition:.3s}

.question{text-align:center;font-size:31px;font-weight:900;margin:35px 0}
.answers{display:grid;gap:14px}
.answer{width:100%;padding:20px}
.answer:active{transform:scale(.98)}

.correct{background:#52df8b!important}
.wrong{background:#ff6969!important}

.record{text-align:center}
.bigscore{font-size:65px;font-weight:900;color:#ffd23f}

.result{text-align:center}
.result .emoji{font-size:70px}
.result h2{font-size:38px}
.resultscore{font-size:55px;font-weight:900;color:#ffd23f}

footer{text-align:center;color:#817b91;margin-top:35px}

@media(max-width:420px){
 .logo{font-size:48px}
 .card{padding:22px}
 .question{font-size:27px}
}
</style>
</head>

<body>
<div class="app">

<div class="logo">RETA<b>2</b></div>
<div class="slogan">¿Hasta dónde podés llegar?</div>

<div class="top">
 <div class="pill">🏆 Récord: <span id="recordTop">0</span></div>
 <div class="pill">⭐ <span id="totalTop">0</span> pts</div>
</div>

<section id="home">

 <div class="card">
  <h2>🔥 Reto del día</h2>
  <p class="sub">5 preguntas. Una oportunidad para superar tu marca.</p>
  <button class="mainbtn" onclick="startGame('Reto del día')">
   JUGAR RETO DEL DÍA
  </button>
 </div>

 <div class="card">
  <h2>🎯 Elegí tu desafío</h2>
  <div class="grid">
   <button class="cat" onclick="startGame('Mente')"><span>🧠</span>Mente</button>
   <button class="cat" onclick="startGame('Divertidos')"><span>😂</span>Divertidos</button>
   <button class="cat" onclick="startGame('Rápidos')"><span>⚡</span>Rápidos</button>
   <button class="cat" onclick="startGame('Difíciles')"><span>🔥</span>Difíciles</button>
  </div>
 </div>

 <div class="card record">
  <h2>🏆 Tu mejor marca</h2>
  <div class="bigscore" id="recordBig">0</div>
  <div class="sub">puntos</div>
 </div>

</section>

<section id="game" class="card hidden">

 <div class="gamehead">
  <div class="pill" id="counter">1/5</div>
  <div class="pill"><span id="score">0</span> pts</div>
 </div>

 <div class="progress"><div class="bar" id="bar"></div></div>

 <div class="question" id="question"></div>
 <div class="answers" id="answers"></div>

</section>

<section id="result" class="card result hidden">
 <div class="emoji" id="resultEmoji">🏆</div>
 <h2 id="resultTitle">¡Terminaste!</h2>
 <p class="sub">Tu puntaje fue</p>
 <div class="resultscore"><span id="finalScore">0</span> pts</div>
 <button class="mainbtn" onclick="goHome()">VOLVER A JUGAR</button>
</section>

<footer>Reta2 · Prototipo V3</footer>

</div>

<script>
const questions=[
 {q:"¿Cuánto es 7 × 8?",a:["54","56","64","48"],ok:"56"},
 {q:"¿Cuánto es 12 × 6?",a:["62","72","82","68"],ok:"72"},
 {q:"¿Qué planeta es conocido como el planeta rojo?",a:["Venus","Marte","Júpiter","Mercurio"],ok:"Marte"},
 {q:"¿Cuántos lados tiene un hexágono?",a:["5","6","7","8"],ok:"6"},
 {q:"¿Cuál es la capital de Argentina?",a:["Córdoba","Rosario","Mendoza","Buenos Aires"],ok:"Buenos Aires"},
 {q:"¿Cuánto es 15 + 27?",a:["32","42","52","38"],ok:"42"},
 {q:"¿Qué animal es el más grande del mundo?",a:["Elefante","Ballena azul","Jirafa","Tiburón"],ok:"Ballena azul"},
 {q:"¿Cuántos minutos tiene una hora?",a:["50","60","70","100"],ok:"60"},
 {q:"¿Cuánto es 9 × 9?",a:["72","81","89","99"],ok:"81"},
 {q:"¿Qué océano es el más grande?",a:["Atlántico","Índico","Pacífico","Ártico"],ok:"Pacífico"}
];

let round=[];
let current=0;
let score=0;

let record=Number(localStorage.getItem("reta2Record")||0);
document.getElementById("recordTop").textContent=record;
document.getElementById("recordBig").textContent=record;

function startGame(category){
 score=0;
 current=0;
 round=[...questions].sort(()=>Math.random()-.5).slice(0,5);

 document.getElementById("home").classList.add("hidden");
 document.getElementById("result").classList.add("hidden");
 document.getElementById("game").classList.remove("hidden");

 showQuestion();
 window.scrollTo(0,0);
}

function showQuestion(){
 const item=round[current];

 document.getElementById("counter").textContent=(current+1)+"/5";
 document.getElementById("score").textContent=score;
 document.getElementById("totalTop").textContent=score;
 document.getElementById("bar").style.width=((current+1)*20)+"%";
 document.getElementById("question").textContent=item.q;

 const box=document.getElementById("answers");
 box.innerHTML="";

 item.a.forEach(option=>{
  const button=document.createElement("button");
  button.className="answer";
  button.textContent=option;
  button.onclick=()=>answer(button,option,item.ok);
  box.appendChild(button);
 });
}

function answer(button,selected,correct){
 const buttons=document.querySelectorAll(".answer");
 buttons.forEach(b=>b.disabled=true);

 if(selected===correct){
  score+=10;
  button.classList.add("correct");
 }else{
  button.classList.add("wrong");
  buttons.forEach(b=>{
   if(b.textContent===correct)b.classList.add("correct");
  });
 }

 document.getElementById("score").textContent=score;
 document.getElementById("totalTop").textContent=score;

 setTimeout(()=>{
  current++;
  if(current<5) showQuestion();
  else finishGame();
 },700);
}

function finishGame(){
 document.getElementById("game").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");
 document.getElementById("finalScore").textContent=score;

 if(score>record){
  record=score;
  localStorage.setItem("reta2Record",record);
  document.getElementById("recordTop").textContent=record;
  document.getElementById("recordBig").textContent=record;
  document.getElementById("resultEmoji").textContent="🏆";
  document.getElementById("resultTitle").textContent="¡NUEVO RÉCORD!";
 }else{
  document.getElementById("resultEmoji").textContent=score>=40?"🔥":"🎯";
  document.getElementById("resultTitle").textContent=
   score>=40?"¡Excelente partida!":"¡Buen intento!";
 }

 window.scrollTo(0,0);
}

function goHome(){
 document.getElementById("result").classList.add("hidden");
 document.getElementById("home").classList.remove("hidden");
 document.getElementById("totalTop").textContent="0";
 window.scrollTo(0,0);
}
</script>

</body>
</html>
