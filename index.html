<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reta2</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:system-ui,-apple-system,sans-serif;
  color:white;
  background:linear-gradient(150deg,#101020,#271340);
}
button{font:inherit}
.app{
  max-width:700px;
  margin:auto;
  padding:30px 18px 70px;
}
.logo{
  text-align:center;
  font-size:58px;
  font-weight:900;
  line-height:1;
}
.logo b{color:#ffd23f}
.slogan{
  text-align:center;
  color:#ccc;
  font-size:20px;
  margin:8px 0 28px;
}
.stats{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:24px;
}
.pill{
  background:#ffffff0d;
  border:1px solid #ffffff1f;
  border-radius:18px;
  padding:12px 15px;
  font-weight:800;
  font-size:16px;
}
.card{
  background:#ffffff0d;
  border:1px solid #ffffff1c;
  border-radius:30px;
  padding:25px 20px;
  margin-bottom:22px;
  box-shadow:0 15px 35px #0002;
}
h2{
  margin:0 0 18px;
  font-size:29px;
}
.daily{
  background:linear-gradient(135deg,#ffffff0c,#ffcf3d12);
}
.daily p{
  color:#ccc;
  font-size:17px;
}
.primary{
  width:100%;
  border:0;
  border-radius:20px;
  background:#ffd23f;
  color:#181526;
  padding:18px;
  font-size:18px;
  font-weight:900;
}
.categories{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.cat{
  border:0;
  border-radius:22px;
  min-height:130px;
  background:#fff;
  color:#181526;
  font-size:18px;
  font-weight:900;
  padding:15px;
}
.cat span{
  display:block;
  font-size:38px;
  margin-bottom:8px;
}
.best{text-align:center}
.best strong{
  display:block;
  color:#ffd23f;
  font-size:70px;
  line-height:1;
}
.best small{
  color:#ccc;
  font-size:18px;
}
.hidden{display:none!important}

.gameTop{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:18px;
}
.gameTop .pill{
  text-align:center;
  padding:10px 5px;
}
.timer{
  font-size:34px;
  text-align:center;
  font-weight:900;
  color:#ffd23f;
  margin:8px 0 12px;
}
.bar{
  height:8px;
  background:#ffffff12;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:25px;
}
.bar div{
  height:100%;
  width:100%;
  background:#ffd23f;
  transition:width 1s linear;
}
.question{
  text-align:center;
  font-size:30px;
  font-weight:900;
  margin:25px 0;
}
.answers{
  display:grid;
  gap:12px;
}
.answer{
  border:0;
  background:white;
  color:#181526;
  border-radius:20px;
  padding:18px;
  font-size:21px;
  font-weight:900;
}
.answer.correct{background:#56d889;color:#102519}
.answer.wrong{background:#ff6868;color:white}
.feedback{
  min-height:30px;
  text-align:center;
  font-weight:900;
  font-size:18px;
  margin-top:15px;
}
.result{text-align:center}
.result .big{
  font-size:76px;
  color:#ffd23f;
  font-weight:900;
  line-height:1;
}
.result p{
  color:#ccc;
  font-size:18px;
}
.share{
  margin-top:12px;
  background:#fff;
}
.footer{
  text-align:center;
  color:#ffffff55;
  margin-top:35px;
}
</style>
</head>

<body>
<div class="app">

  <div class="logo">RETA<b>2</b></div>
  <div class="slogan">¿Hasta dónde podés llegar?</div>

  <div class="stats">
    <div class="pill">🏆 Récord: <span id="recordTop">0</span></div>
    <div class="pill">⭐ <span id="pointsTop">0</span> pts</div>
  </div>

  <section id="home">
    <div class="card daily">
      <h2>🔥 Reto del día</h2>
      <p>Superá 10 preguntas antes de quedarte sin vidas.</p>
      <button class="primary" onclick="startGame('Reto del día')">
        JUGAR RETO DEL DÍA
      </button>
    </div>

    <div class="card">
      <h2>🎯 Elegí tu desafío</h2>
      <div class="categories">
        <button class="cat" onclick="startGame('Mente')">
          <span>🧠</span>Mente
        </button>
        <button class="cat" onclick="startGame('Divertidos')">
          <span>😂</span>Divertidos
        </button>
        <button class="cat" onclick="startGame('Rápidos')">
          <span>⚡</span>Rápidos
        </button>
        <button class="cat" onclick="startGame('Difíciles')">
          <span>🔥</span>Difíciles
        </button>
      </div>
    </div>

    <div class="card best">
      <h2>🏆 Tu mejor marca</h2>
      <strong id="best">0</strong>
      <small>puntos</small>
    </div>
  </section>

  <section id="game" class="card hidden">
    <div class="gameTop">
      <div class="pill">❤️ <span id="lives">3</span></div>
      <div class="pill">🔥 <span id="streak">0</span></div>
      <div class="pill">⭐ <span id="score">0</span></div>
    </div>

    <div class="timer">⏱️ <span id="time">15</span>s</div>
    <div class="bar"><div id="timeBar"></div></div>

    <div class="pill" style="display:inline-block">
      <span id="counter">1/10</span>
    </div>

    <div class="question" id="question"></div>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback"></div>
  </section>

  <section id="result" class="card result hidden">
    <h2 id="resultTitle">🏁 ¡Reto terminado!</h2>
    <p>Tu puntuación</p>
    <div class="big" id="finalScore">0</div>
    <p id="resultMessage"></p>

    <button class="primary" onclick="goHome()">VOLVER A JUGAR</button>
    <button class="primary share" onclick="shareResult()">📤 COMPARTIR RESULTADO</button>
  </section>

  <div class="footer">Reta2 · Prototipo V4</div>
</div>

<script>
const questions = {
  Mente: [
    ["¿Cuánto es 12 × 6?",["62","72","82","68"],"72"],
    ["¿Cuánto es 9 × 8?",["81","72","64","69"],"72"],
    ["¿Qué número sigue? 2, 4, 8, 16...",["20","24","32","30"],"32"],
    ["¿Cuánto es 144 ÷ 12?",["10","11","12","14"],"12"],
    ["Si tenés 3 docenas, ¿cuántos hay?",["24","30","36","40"],"36"],
    ["¿Cuánto es 15 + 27?",["40","42","44","46"],"42"],
    ["¿Cuánto es 100 ÷ 4?",["20","25","30","40"],"25"],
    ["¿Qué número sigue? 5, 10, 15, 20...",["22","24","25","30"],"25"],
    ["¿Cuánto es 7 × 7?",["42","47","49","56"],"49"],
    ["¿Cuánto es 81 ÷ 9?",["7","8","9","10"],"9"],
    ["¿Cuál es la mitad de 150?",["50","65","75","80"],"75"],
    ["¿Cuánto es 13 × 4?",["48","50","52","56"],"52"],
    ["Si tengo 20 y gasto 7, ¿cuánto queda?",["11","12","13","14"],"13"],
    ["¿Cuánto es 11 × 11?",["111","121","131","141"],"121"],
    ["¿Qué número sigue? 3, 6, 9, 12...",["13","14","15","16"],"15"],
    ["¿Cuánto es 200 - 75?",["115","120","125","135"],"125"],
    ["¿Cuál es el doble de 48?",["86","92","96","98"],"96"],
    ["¿Cuánto es 64 ÷ 8?",["6","7","8","9"],"8"],
    ["¿Cuánto es 25 × 4?",["75","90","100","125"],"100"],
    ["¿Cuál es la mitad de 90?",["40","45","50","55"],"45"]
  ],

  Divertidos: [
    ["¿Qué animal dice 'miau'?",["Perro","Gato","Vaca","Pato"],"Gato"],
    ["¿Cuál tiene agujas pero no cose?",["Reloj","Mesa","Zapato","Libro"],"Reloj"],
    ["¿Qué mes tiene 28 días?",["Febrero","Junio","Todos","Enero"],"Todos"],
    ["¿Qué sube pero nunca baja?",["Ascensor","La edad","Pelota","Avión"],"La edad"],
    ["¿Qué tiene dientes pero no come?",["Peine","Perro","Tiburón","León"],"Peine"],
    ["¿Qué tiene cuello pero no cabeza?",["Botella","Gato","Camisa","Árbol"],"Botella"],
    ["¿Qué tiene patas pero no camina?",["Mesa","Perro","Gato","Caballo"],"Mesa"],
    ["¿Qué se moja mientras seca?",["Toalla","Agua","Sol","Fuego"],"Toalla"],
    ["¿Qué tiene hojas pero no es árbol?",["Libro","Pasto","Flor","Rama"],"Libro"],
    ["¿Qué podés atrapar pero no lanzar?",["Pelota","Resfrío","Piedra","Moneda"],"Resfrío"],
    ["¿Qué tiene ciudades pero no casas?",["Mapa","País","Barrio","Calle"],"Mapa"],
    ["¿Qué tiene teclas pero no abre puertas?",["Piano","Llave","Candado","Auto"],"Piano"],
    ["¿Qué corre pero no tiene piernas?",["Agua","Perro","Persona","Caballo"],"Agua"],
    ["¿Qué tiene un ojo pero no puede ver?",["Aguja","Pirata","Gato","Cámara"],"Aguja"],
    ["¿Qué tiene corona pero no es rey?",["Piña","Príncipe","Caballo","Sombrero"],"Piña"],
    ["¿Qué aparece una vez en minuto y dos en momento?",["La M","La O","La N","La T"],"La M"],
    ["¿Qué podés romper sin tocar?",["Promesa","Vidrio","Plato","Vaso"],"Promesa"],
    ["¿Qué tiene cuatro ruedas y vuela?",["Camión de basura","Avión","Bicicleta","Tren"],"Camión de basura"],
    ["¿Qué cuanto más sacás, más grande queda?",["Un agujero","Una caja","Una botella","Una piedra"],"Un agujero"],
    ["¿Qué va alrededor del mundo y queda en una esquina?",["Estampilla","Avión","Barco","Sol"],"Estampilla"]
  ],

  Rápidos: [
    ["5 + 7 = ?",["10","11","12","13"],"12"],
    ["10 × 3 = ?",["20","30","40","33"],"30"],
    ["100 - 25 = ?",["65","70","75","85"],"75"],
    ["8 + 9 = ?",["16","17","18","19"],"17"],
    ["6 × 7 = ?",["36","40","42","48"],"42"],
    ["20 ÷ 4 = ?",["4","5","6","8"],"5"],
    ["9 + 6 = ?",["13","14","15","16"],"15"],
    ["50 - 18 = ?",["30","32","34","38"],"32"],
    ["8 × 5 = ?",["35","40","45","50"],"40"],
    ["36 ÷ 6 = ?",["4","5","6","7"],"6"],
    ["14 + 19 = ?",["31","32","33","34"],"33"],
    ["7 × 8 = ?",["48","54","56","64"],"56"],
    ["90 - 40 = ?",["40","45","50","60"],"50"],
    ["12 × 3 = ?",["30","33","36","39"],"36"],
    ["45 ÷ 5 = ?",["7","8","9","10"],"9"],
    ["17 + 8 = ?",["23","24","25","26"],"25"],
    ["11 × 5 = ?",["45","50","55","60"],"55"],
    ["72 ÷ 8 = ?",["7","8","9","10"],"9"],
    ["60 - 17 = ?",["41","42","43","44"],"43"],
    ["9 × 9 = ?",["72","79","81","89"],"81"]
  ],

  Difíciles: [
    ["15 × 12 = ?",["160","170","180","190"],"180"],
    ["225 ÷ 15 = ?",["10","12","15","20"],"15"],
    ["17 × 6 = ?",["92","102","112","96"],"102"],
    ["¿Raíz cuadrada de 169?",["11","12","13","14"],"13"],
    ["25 × 16 = ?",["350","375","400","425"],"400"],
    ["19 × 7 = ?",["123","133","143","153"],"133"],
    ["324 ÷ 18 = ?",["16","17","18","19"],"18"],
    ["¿Raíz cuadrada de 225?",["13","14","15","16"],"15"],
    ["32 × 12 = ?",["364","374","384","394"],"384"],
    ["1000 ÷ 25 = ?",["25","30","40","50"],"40"],
    ["¿Cuánto es 18²?",["314","324","334","344"],"324"],
    ["27 × 14 = ?",["368","378","388","398"],"378"],
    ["625 ÷ 25 = ?",["15","20","25","30"],"25"],
    ["¿Raíz cuadrada de 196?",["12","13","14","15"],"14"],
    ["125 × 4 = ?",["400","450","500","550"],"500"],
    ["21 × 13 = ?",["253","263","273","283"],"273"],
    ["840 ÷ 20 = ?",["40","42","44","46"],"42"],
    ["¿Cuánto es 16²?",["236","246","256","266"],"256"],
    ["48 × 5 = ?",["220","230","240","250"],"240"],
    ["900 ÷ 30 = ?",["20","25","30","35"],"30"]
  ]
};
let score=0;
let lives=3;
let streak=0;
let current=0;
let gameQuestions=[];
let timer;
let timeLeft=15;
let locked=false;
let category="";

let record=Number(localStorage.getItem("reta2Record")||0);
document.getElementById("best").textContent=record;
document.getElementById("recordTop").textContent=record;

function shuffle(arr){
  return [...arr].sort(()=>Math.random()-.5);
}

function startGame(cat){
  category=cat;
  score=0;
  lives=3;
  streak=0;
  current=0;

  let pool;
  if(cat==="Reto del día"){
    pool=[
      ...questions.Mente,
      ...questions.Divertidos,
      ...questions.Rápidos,
      ...questions.Difíciles
    ];
  }else{
    pool=questions[cat];
  }

  gameQuestions=shuffle(pool);

  while(gameQuestions.length<10){
    gameQuestions=[...gameQuestions,...shuffle(pool)];
  }

  gameQuestions=gameQuestions.slice(0,10);

  document.getElementById("home").classList.add("hidden");
  document.getElementById("result").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");

  updateStats();
  showQuestion();
  window.scrollTo({top:0,behavior:"smooth"});
}

function showQuestion(){
  if(current>=gameQuestions.length || lives<=0){
    endGame();
    return;
  }

  locked=false;
  clearInterval(timer);
  timeLeft=15;

  const q=gameQuestions[current];

  document.getElementById("counter").textContent=(current+1)+"/10";
  document.getElementById("question").textContent=q[0];
  document.getElementById("feedback").textContent="";
  document.getElementById("time").textContent=timeLeft;
  document.getElementById("timeBar").style.width="100%";

  const answers=document.getElementById("answers");
  answers.innerHTML="";

  shuffle(q[1]).forEach(option=>{
    const btn=document.createElement("button");
    btn.className="answer";
    btn.textContent=option;
    btn.onclick=()=>chooseAnswer(btn,option,q[2]);
    answers.appendChild(btn);
  });

  timer=setInterval(()=>{
    timeLeft--;
    document.getElementById("time").textContent=timeLeft;
    document.getElementById("timeBar").style.width=(timeLeft/15*100)+"%";

    if(timeLeft<=0){
      clearInterval(timer);
      timeout();
    }
  },1000);
}

function chooseAnswer(button,selected,correct){
  if(locked)return;
  locked=true;
  clearInterval(timer);

  if(selected===correct){
    streak++;

    const bonus=Math.min(streak*2,10);
    const earned=10+bonus+timeLeft;
    const scoreBefore=score;

    score+=earned;

    button.classList.add("correct");

    const crossedLifeGoal=
      Math.floor(score/100)>Math.floor(scoreBefore/100);

    if(crossedLifeGoal && lives<5){
      lives++;
      document.getElementById("feedback").textContent=
        "❤️ ¡VIDA EXTRA! +"+earned+" pts";
    }else{
      document.getElementById("feedback").textContent=
        "🔥 ¡Correcto! +"+earned+" pts";
    }

  }else{
    lives--;
    streak=0;

    button.classList.add("wrong");

    document.getElementById("feedback").textContent=
      "💔 Perdiste una vida";

    [...document.querySelectorAll(".answer")].forEach(b=>{
      if(b.textContent===correct){
        b.classList.add("correct");
      }
    });
  }

  updateStats();

  setTimeout(()=>{
    current++;
    showQuestion();
  },900);
}

function timeout(){
  if(locked)return;
  locked=true;
  lives--;
  streak=0;

  document.getElementById("feedback").textContent="⏱️ ¡Se terminó el tiempo!";
  updateStats();

  setTimeout(()=>{
    current++;
    showQuestion();
  },900);
}

function updateStats(){
  document.getElementById("lives").textContent=lives;
  document.getElementById("streak").textContent=streak;
  document.getElementById("score").textContent=score;
  document.getElementById("pointsTop").textContent=score;
}

function endGame(){
  clearInterval(timer);

  document.getElementById("game").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");

  document.getElementById("finalScore").textContent=score;

  let message="¡Buen intento! Volvé por una marca mejor 💪";

  if(score>=100) message="🔥 ¡Tremenda partida!";
  if(score>=180) message="🏆 ¡Sos una máquina!";
  if(score>=250) message="👑 ¡Nivel legendario!";

  if(score>record){
    record=score;
    localStorage.setItem("reta2Record",record);
    message="🎉 ¡NUEVO RÉCORD! "+record+" puntos";
  }

  document.getElementById("resultMessage").textContent=message;
  document.getElementById("best").textContent=record;
  document.getElementById("recordTop").textContent=record;

  window.scrollTo({top:0,behavior:"smooth"});
}

function goHome(){
  clearInterval(timer);
  document.getElementById("result").classList.add("hidden");
  document.getElementById("game").classList.add("hidden");
  document.getElementById("home").classList.remove("hidden");
  document.getElementById("pointsTop").textContent="0";
  window.scrollTo({top:0,behavior:"smooth"});
}

async function shareResult(){
  const text="🔥 Hice "+score+" puntos en Reta2. ¿Podés superarme?";

  if(navigator.share){
    try{
      await navigator.share({
        title:"Reta2",
        text:text,
        url:location.href
      });
    }catch(e){}
  }else{
    try{
      await navigator.clipboard.writeText(text+" "+location.href);
      alert("Resultado copiado 📋");
    }catch(e){
      alert(text);
    }
  }
}
</script>
</body>
</html>
